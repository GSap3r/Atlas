  <div class="login-card">
    <img src="assets/img/logo.png" alt="Atlas" class="login-logo"/>
    <h1 class="login-title">Atlas</h1>
    <p class="login-sub">Entre para continuar</p>
    <form id="loginForm" onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label class="form-label">Usuário</label>
        <input class="form-control" id="loginUsername" name="username" autocomplete="username" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input class="form-control" id="loginSenha" name="senha" type="password" autocomplete="current-password" required/>
      </div>
      <div id="loginErro" class="login-erro" style="display:none"></div>
      <button type="submit" class="btn btn-primary w-full" id="loginSubmitBtn">Entrar</button>
    </form>
  </div>
